<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root { --fond-haut:#0b0710; --fond-bas:#1a0f2a; --violet:#7b2cbf; --violet-clair:#c77dff; --gris:#b9b3c6; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--fond-haut); }
#root { position:relative; width:100%; height:100%; font-family:"Montserrat", sans-serif; color:#fff; }
#fond { position:absolute; inset:0;
  background: radial-gradient(900px 700px at 50% 34%, rgba(123,44,191,0.22), rgba(0,0,0,0) 70%),
              linear-gradient(180deg, var(--fond-haut), var(--fond-bas)); }
/* zone utile : x 110-970, y 250-1120 (au-dessus des sous-titres, hors marges des réseaux) */
.tete { position:absolute; top:250px; left:110px; width:860px; text-align:center; }
.surtitre { font-size:30px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--violet-clair); }
.titre { margin-top:14px; font-size:80px; font-weight:800; letter-spacing:-0.01em; }
.filet { width:120px; height:8px; margin:22px auto 0; border-radius:4px; background:var(--violet-clair); }

.case { position:absolute; width:250px; height:270px; border-radius:26px; background:rgba(123,44,191,0.16);
  border:3px solid rgba(199,125,255,0.65); box-shadow:0 18px 40px rgba(0,0,0,0.45); }
.z { position:absolute; top:18px; left:22px; font-size:32px; font-weight:600; color:var(--gris); }
.sym { position:absolute; top:58px; width:100%; text-align:center; font-size:110px; font-weight:800; color:var(--violet-clair); }
.nom { position:absolute; bottom:22px; width:100%; text-align:center; font-size:34px; font-weight:600; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.42" data-width="1080" data-height="1920">
      <div id="fond" class="clip" data-start="0" data-duration="8.42" data-track-index="0" style="z-index:1"></div>
      <div id="scene" class="clip" data-start="0" data-duration="8.42" data-track-index="1" style="z-index:2">
        <div class="tete" id="tete"><div class="surtitre">Le granite de Montebras</div><div class="titre">Métaux rares</div><div class="filet"></div></div>
        <div class="case" id="m0" style="left:125px;top:520px"><div class="z">50</div><div class="sym">Sn</div><div class="nom">Étain</div></div>
        <div class="case" id="m1" style="left:415px;top:520px"><div class="z">3</div><div class="sym">Li</div><div class="nom">Lithium</div></div>
        <div class="case" id="m2" style="left:705px;top:520px"><div class="z">41</div><div class="sym">Nb</div><div class="nom">Niobium</div></div>
        <div class="case" id="m3" style="left:270px;top:830px"><div class="z">73</div><div class="sym">Ta</div><div class="nom">Tantale</div></div>
        <div class="case" id="m4" style="left:560px;top:830px"><div class="z">74</div><div class="sym">W</div><div class="nom">Tungstène</div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // lente avancée de caméra sur toute la séquence
      tl.fromTo("#scene", { scale: 1 }, { scale: 1.035, duration: 8.42, ease: "none" }, 0);
      tl.fromTo("#tete", { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);

      tl.fromTo("#m0", { opacity: 0, scale: 0.7, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 3.74);
      tl.fromTo("#m1", { opacity: 0, scale: 0.7, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 4.14);
      tl.fromTo("#m2", { opacity: 0, scale: 0.7, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 4.66);
      tl.fromTo("#m3", { opacity: 0, scale: 0.7, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 5.17);
      tl.fromTo("#m4", { opacity: 0, scale: 0.7, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 5.92);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
