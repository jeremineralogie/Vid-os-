<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root { --fond-haut:#0b0710; --fond-bas:#1a0f2a; --violet:#7b2cbf; --violet-clair:#c77dff; --gris:#c3bdd0; --uranium:#d4f25a; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--fond-haut); }
#root { position:relative; width:100%; height:100%; font-family:"Montserrat", sans-serif; color:#fff; }
#fond { position:absolute; inset:0;
  background: radial-gradient(900px 700px at 50% 34%, rgba(123,44,191,0.22), rgba(0,0,0,0) 70%),
              linear-gradient(180deg, var(--fond-haut), var(--fond-bas)); }
#photo { position:absolute; inset:0; overflow:hidden; }
#photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.5) saturate(1.05); }
#photo-voile { position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(11,7,16,0.55) 0%, rgba(11,7,16,0.15) 30%, rgba(11,7,16,0.25) 60%, rgba(11,7,16,0.75) 100%); }
/* zone utile : x 110-970, y 250-1120 (au-dessus des sous-titres, hors marges des réseaux) */
.tete { position:absolute; top:250px; left:110px; width:860px; text-align:center; }
.surtitre { font-size:30px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--violet-clair); }
.titre { margin-top:14px; font-size:80px; font-weight:800; letter-spacing:-0.01em; text-shadow:0 4px 18px rgba(0,0,0,0.6); }
.filet { width:120px; height:8px; margin:22px auto 0; border-radius:4px; background:var(--violet-clair); }
.grand { font-weight:800; line-height:1; color:var(--violet-clair); font-variant-numeric:tabular-nums; letter-spacing:-0.03em; }
.unite { font-size:50px; font-weight:700; }
.petit { font-size:34px; font-weight:600; color:var(--gris); }
.periode { position:absolute; left:150px; width:780px; }
.barre { position:relative; height:22px; border-radius:11px; background:rgba(255,255,255,0.12); overflow:hidden; }
.barre-plein { position:absolute; inset:0; border-radius:11px; background:linear-gradient(90deg, var(--violet), var(--violet-clair)); transform-origin:left center; }
.bornes { display:flex; justify-content:space-between; margin-top:14px; font-size:36px; font-weight:700; color:var(--gris); }
.badge { display:inline-block; padding:12px 26px; border-radius:40px; font-size:32px; font-weight:700;
  background:rgba(123,44,191,0.28); border:2px solid rgba(199,125,255,0.7); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.69" data-width="1080" data-height="1920">
      <div id="photo" class="clip" data-start="0" data-duration="9.69" data-track-index="0" style="z-index:1"><img id="photo-img" src="assets/fond.jpg" alt="" /><div id="photo-voile"></div></div>
      <div id="scene" class="clip" data-start="0" data-duration="9.69" data-track-index="1" style="z-index:2">
        <div class="tete" id="tete"><div class="surtitre">Prudence</div><div class="titre">Minéraux radioactifs</div><div class="filet"></div></div>
        <div id="trefle" style="position:absolute;top:470px;left:445px"><svg width="190" height="190" viewBox="-100 -100 200 200"><circle r="96" fill="#d4f25a"/><circle r="14" fill="#0b0710"/><path d="M0,0 L-40.0,-69.3 A80,80 0 0,1 40.0,-69.3 Z" fill="#0b0710" transform="scale(1)"/><path d="M0,0 L80.0,0.0 A80,80 0 0,1 40.0,69.3 Z" fill="#0b0710" transform="scale(1)"/><path d="M0,0 L-40.0,69.3 A80,80 0 0,1 -80.0,0.0 Z" fill="#0b0710" transform="scale(1)"/><circle r="24" fill="#d4f25a"/><circle r="14" fill="#0b0710"/></svg></div>
        <div id="r0" style="position:absolute;top:720px;left:150px;width:780px;height:100px;border-radius:24px;background:rgba(11,7,16,0.7);border:2px solid rgba(212,242,90,0.6);display:flex;align-items:center;padding:0 34px;font-size:42px;font-weight:700"><span style="color:var(--uranium);margin-right:22px">✓</span>Gants pour les manipuler</div>
        <div id="r1" style="position:absolute;top:840px;left:150px;width:780px;height:100px;border-radius:24px;background:rgba(11,7,16,0.7);border:2px solid rgba(212,242,90,0.6);display:flex;align-items:center;padding:0 34px;font-size:42px;font-weight:700"><span style="color:var(--uranium);margin-right:22px">✓</span>Rangés en boîte étanche</div>
        <div id="r2" style="position:absolute;top:960px;left:150px;width:780px;height:100px;border-radius:24px;background:rgba(11,7,16,0.7);border:2px solid rgba(212,242,90,0.6);display:flex;align-items:center;padding:0 34px;font-size:42px;font-weight:700"><span style="color:var(--uranium);margin-right:22px">✓</span>Dans une pièce aérée</div>
        <div id="src" class="petit" style="position:absolute;top:1090px;width:100%;text-align:center;font-size:28px">Recommandations de l'IRSN</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // lente avancée de caméra sur toute la séquence
      tl.fromTo("#scene", { scale: 1 }, { scale: 1.03, duration: 9.69, ease: "none" }, 0);
      tl.fromTo("#photo-img", { scale: 1.0 }, { scale: 1.08, duration: 9.69, ease: "none" }, 0);
      tl.fromTo("#tete", { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);

      tl.fromTo("#trefle", { opacity: 0, scale: 0.5, rotation: -90 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.6)" }, 0.3);
      tl.fromTo("#r0", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.63);
      tl.fromTo("#r1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 6.74);
      tl.fromTo("#r2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 7.09);
      tl.fromTo("#src", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.49);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
