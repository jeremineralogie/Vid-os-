<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root { --violet:#7b2cbf; --violet-clair:#c77dff; --gris:#d6d0e0; --miel:#f2b544; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
#root { position:relative; width:100%; height:100%; font-family:"Montserrat", sans-serif; color:#fff; }
#photo { position:absolute; inset:0; overflow:hidden; }
#photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.5) saturate(1.05); }
#photo-voile { position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.12) 30%, rgba(0,0,0,0.22) 60%, rgba(0,0,0,0.75) 100%); }
/* zone utile : x 110-970, y 250-1120 (au-dessus des sous-titres, hors marges des réseaux) */
.tete { position:absolute; top:250px; left:110px; width:860px; text-align:center; }
.surtitre { font-size:30px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--violet-clair);
  text-shadow:0 2px 10px rgba(0,0,0,0.8); }
.titre { margin-top:14px; font-size:80px; font-weight:800; letter-spacing:-0.01em; text-shadow:0 4px 18px rgba(0,0,0,0.7); }
.filet { width:120px; height:8px; margin:22px auto 0; border-radius:4px; background:var(--violet-clair); }
.grand { font-weight:800; line-height:1; color:var(--miel); font-variant-numeric:tabular-nums; letter-spacing:-0.03em;
  text-shadow:0 6px 24px rgba(0,0,0,0.6); }
.unite { font-size:46px; font-weight:700; text-shadow:0 3px 14px rgba(0,0,0,0.8); }
.petit { font-size:34px; font-weight:600; color:var(--gris); text-shadow:0 2px 10px rgba(0,0,0,0.8); }
.badge { display:inline-block; padding:12px 26px; border-radius:40px; font-size:32px; font-weight:700;
  background:rgba(0,0,0,0.55); border:2px solid rgba(199,125,255,0.75); }
.panneau { background:rgba(8,6,12,0.66); border:2px solid rgba(199,125,255,0.55); border-radius:34px;
  box-shadow:0 24px 60px rgba(0,0,0,0.55); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.42" data-width="1080" data-height="1920">
      <div id="photo" class="clip" data-start="0" data-duration="5.42" data-track-index="0" style="z-index:1"><img id="photo-img" src="assets/fond.jpg" alt="" /><div id="photo-voile"></div></div>
      <div id="scene" class="clip" data-start="0" data-duration="5.42" data-track-index="1" style="z-index:2">
        <div class="tete" id="tete"><div class="surtitre">Ferdinand Gonnard</div><div class="titre">Minéralogie</div><div class="filet"></div></div>
        <div id="annee" class="grand" style="position:absolute;top:560px;width:100%;text-align:center;font-size:250px">1850</div>
        <div id="legende" class="petit" style="position:absolute;top:850px;left:110px;width:860px;text-align:center">du département du Puy-de-Dôme</div>
        <div id="badge" style="position:absolute;top:960px;width:100%;text-align:center"><span class="badge">Paris, F. Savy</span></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#photo-img", { scale: 1.0 }, { scale: 1.08, duration: 5.42, ease: "none" }, 0);
      tl.fromTo("#tete", { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);

      tl.fromTo("#annee", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.30);
      const annee = { v: 1850 };
      tl.fromTo(annee, { v: 1850 }, { v: 1870, duration: 1.60, ease: "power2.out",
        onUpdate: () => { const v = annee.v; document.querySelector("#annee").textContent = "" + Math.round(v).toString() + ""; } }, 0.40);
      tl.fromTo("#legende", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.50);
      tl.fromTo("#badge", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.67);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
