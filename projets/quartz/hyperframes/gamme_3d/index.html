<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root { --violet-clair:#c77dff; --gris:#d6d0e0; --or:#f2b544; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
#root { position:relative; width:100%; height:100%; font-family:"Montserrat", sans-serif; color:#fff; }
.plan { position:absolute; inset:0; overflow:hidden; }
.plan img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#voile { position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.55) 16%, rgba(0,0,0,0) 27%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.7) 100%); }
.tete { position:absolute; top:250px; left:110px; width:860px; text-align:center; }
.surtitre { font-size:30px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--violet-clair); text-shadow:0 2px 10px #000; }
.titre { margin-top:14px; font-size:76px; font-weight:800; white-space:nowrap; text-shadow:0 4px 18px rgba(0,0,0,0.8); }
.filet { width:120px; height:8px; margin:22px auto 0; border-radius:4px; background:var(--violet-clair); }
.etiquette { position:absolute; padding:8px 18px; border-radius:22px; background:rgba(8,6,12,0.92); border:2px solid var(--or);
  font-size:28px; font-weight:800; white-space:nowrap; box-shadow:0 8px 24px rgba(0,0,0,0.6); }
.etiquette small { display:block; font-size:21px; font-weight:600; color:#ede9f2; }
.legende { position:absolute; left:110px; width:860px; text-align:center; font-size:30px; font-weight:700; line-height:1.35;
  padding:16px 22px; border-radius:24px; background:rgba(8,6,12,0.78); border:2px solid rgba(199,125,255,0.5); }
.mention { position:absolute; left:110px; top:1176px; width:860px; text-align:right; font-size:20px; font-weight:600; font-style:italic;
  color:#fff; text-shadow:0 2px 6px #000, 0 0 12px #000; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.50" data-width="1080" data-height="1920">
      <div id="scene" class="clip" data-start="0" data-duration="20.50" data-track-index="0" style="z-index:1">
        <div class="plan"><img id="i1" src="assets/gamme.png"/></div>
        <div class="tete" id="tete" style="z-index:5"><div class="surtitre">Quartz fumé</div><div class="titre">Du gris au noir</div><div class="filet"></div></div>
        <div class="mention" id="mention" style="z-index:5">Illustration 3D</div>
        <div id="n-clair" class="etiquette" style="left:280.1px;top:949.9px;transform:translate(-50%,0);font-size:24px;z-index:5;opacity:0">fumé clair</div>
        <div id="n-fume" class="etiquette" style="left:538.4px;top:949.9px;transform:translate(-50%,0);font-size:24px;z-index:5;opacity:0">fumé</div>
        <div id="n-morion" class="etiquette" style="left:796.6px;top:949.9px;transform:translate(-50%,0);font-size:24px;z-index:5;opacity:0">morion</div>
        <div id="leg1" class="legende" style="top:1050px;z-index:5;opacity:0">Plus il y a de centres colorés,<br/>plus le quartz est sombre</div>
        <div id="leg2" class="legende" style="top:1050px;z-index:5;opacity:0">Cela dépend de sa teneur en <b>aluminium</b>…</div>
        <div id="leg3" class="legende" style="top:1050px;z-index:5;opacity:0">… et de la <b>dose de rayonnement</b> reçue</div>
        <div id="leg4" class="legende" style="top:1050px;z-index:5;opacity:0">La chaleur, au cours de son histoire,<br/>peut aussi l'éclaircir</div>
        <div id="voile"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#i1", { scale: 1.0 }, { scale: 1.06, duration: 20.50, ease: "none" }, 0.00);
      tl.fromTo("#tete", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.10);
      tl.fromTo("#mention", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.60);
      tl.fromTo("#leg1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.70);
      tl.to("#leg1", { opacity: 0, duration: 0.4 }, 6.55);
      tl.fromTo("#n-clair", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 2.80);
      tl.fromTo("#n-fume", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 3.30);
      tl.fromTo("#n-morion", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 3.80);
      tl.fromTo("#leg2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.20);
      tl.to("#leg2", { opacity: 0, duration: 0.4 }, 11.05);
      tl.fromTo("#leg3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.70);
      tl.to("#leg3", { opacity: 0, duration: 0.4 }, 15.55);
      tl.fromTo("#leg4", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 16.20);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
