<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root { --violet:#7b2cbf; --violet-clair:#c77dff; --gris:#d6d0e0; --or:#f2b544; --o:#ff6b6b; --si:#9d7bff; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
#root { position:relative; width:100%; height:100%; font-family:"Montserrat", sans-serif; color:#fff; }
#photo { position:absolute; inset:0; overflow:hidden; }
#photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.42) saturate(1.0); }
#photo-voile { position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.8) 100%); }
.tete { position:absolute; top:250px; left:110px; width:860px; text-align:center; }
.surtitre { font-size:30px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--violet-clair);
  text-shadow:0 2px 10px rgba(0,0,0,0.8); }
.titre { margin-top:14px; font-size:76px; font-weight:800; white-space:nowrap; text-shadow:0 4px 18px rgba(0,0,0,0.7); }
.filet { width:120px; height:8px; margin:22px auto 0; border-radius:4px; background:var(--violet-clair); }
.panneau { position:absolute; left:110px; top:430px; width:860px; height:640px; background:rgba(8,6,12,0.72);
  border:2px solid rgba(199,125,255,0.55); border-radius:34px; box-shadow:0 24px 60px rgba(0,0,0,0.55); overflow:hidden; }
.schema { position:absolute; left:110px; top:1086px; width:860px; text-align:right; font-size:20px; font-weight:600; color:rgba(214,208,224,0.8); font-style:italic; text-shadow:0 2px 6px #000; }
svg text { font-family:"Montserrat", sans-serif; }
.leg { font-size:26px; font-weight:600; fill:#e8e2f0; }
.leg-or { font-size:28px; font-weight:800; fill:#f2b544; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.00" data-width="1080" data-height="1920">
      <div id="photo" class="clip" data-start="0" data-duration="9.00" data-track-index="0" style="z-index:1"><img id="photo-img" src="assets/fond.jpg" alt="" /><div id="photo-voile"></div></div>
      <div id="scene" class="clip" data-start="0" data-duration="9.00" data-track-index="1" style="z-index:2">
        <div class="tete" id="tete"><div class="surtitre">La structure</div><div class="titre" style="font-size:76px">Le quartz, SiO₂</div><div class="filet"></div></div>
        <div class="panneau" id="panneau"><svg width="860" height="640" viewBox="0 0 860 640"><polygon id="tetra" points="300,112 150,400 450,400" fill="rgba(157,123,255,0.10)" stroke="rgba(199,125,255,0.6)" stroke-width="3"/><g id="arr"><line x1="300" y1="112" x2="420" y2="250" stroke="rgba(199,125,255,0.45)" stroke-width="3" stroke-dasharray="10 8"/><line x1="150" y1="400" x2="420" y2="250" stroke="rgba(199,125,255,0.45)" stroke-width="3" stroke-dasharray="10 8"/><line x1="450" y1="400" x2="420" y2="250" stroke="rgba(199,125,255,0.45)" stroke-width="3" stroke-dasharray="10 8"/><line x1="300" y1="300" x2="420" y2="250" stroke="rgba(232,226,240,0.55)" stroke-width="7" stroke-linecap="round"/><g opacity="0.6"><g id="o3"><circle cx="420" cy="250" r="34" fill="#d9485a" stroke="rgba(255,255,255,0.85)" stroke-width="3"/><text x="420" y="260.8" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">O</text></g></g></g><line id="b0" x1="300" y1="300" x2="300" y2="112" stroke="#e8e2f0" stroke-width="8" stroke-linecap="round"/><line id="b1" x1="300" y1="300" x2="150" y2="400" stroke="#e8e2f0" stroke-width="8" stroke-linecap="round"/><line id="b2" x1="300" y1="300" x2="450" y2="400" stroke="#e8e2f0" stroke-width="8" stroke-linecap="round"/><g id="si"><circle cx="300" cy="300" r="52" fill="#7b2cbf" stroke="rgba(255,255,255,0.85)" stroke-width="3"/><text x="300" y="315.8" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">Si</text></g><g id="o0"><circle cx="300" cy="112" r="42" fill="#d9485a" stroke="rgba(255,255,255,0.85)" stroke-width="3"/><text x="300" y="125.7" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">O</text></g><g id="o1"><circle cx="150" cy="400" r="42" fill="#d9485a" stroke="rgba(255,255,255,0.85)" stroke-width="3"/><text x="150" y="413.7" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">O</text></g><g id="o2"><circle cx="450" cy="400" r="42" fill="#d9485a" stroke="rgba(255,255,255,0.85)" stroke-width="3"/><text x="450" y="413.7" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">O</text></g><g id="txt"><text x="650" y="190" text-anchor="middle" font-size="96" font-weight="800" fill="#fff">SiO<tspan font-size="58" dy="18">2</tspan></text><text x="650" y="250" text-anchor="middle" class="leg-or">dioxyde de silicium</text><text x="650" y="330" text-anchor="middle" class="leg">1 atome de silicium</text><text x="650" y="368" text-anchor="middle" class="leg">pour 2 d'oxygène</text></g><g id="txt2"><text x="430" y="500" text-anchor="middle" class="leg">Chaque silicium est au centre de 4 oxygènes,</text><text x="430" y="540" text-anchor="middle" class="leg">et chaque oxygène est partagé</text><text x="430" y="580" text-anchor="middle" class="leg">entre deux de ces tétraèdres.</text></g></svg></div>
        <div class="schema" id="schema">Illustration schématique</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#photo-img", { scale: 1.0 }, { scale: 1.07, duration: 9.00, ease: "none" }, 0);
      tl.fromTo("#tete", { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#panneau", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo("#schema", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
      tl.fromTo("#si", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.60);
      tl.fromTo("#b0", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.90);
      tl.fromTo("#b1", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.05);
      tl.fromTo("#b2", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.20);
      tl.fromTo("#o0", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.00);
      tl.fromTo("#o1", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.20);
      tl.fromTo("#o2", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.40);
      tl.fromTo("#tetra", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 1.80);
      tl.fromTo("#arr", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 2.00);
      tl.fromTo("#txt", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.20);
      tl.fromTo("#txt2", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.40);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
