<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root { --violet:#7b2cbf; --violet-clair:#c77dff; --gris:#d6d0e0; --or:#f2b544; --o:#ff6b6b; --si:#9d7bff; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
#root { position:relative; width:100%; height:100%; font-family:"Montserrat", sans-serif; color:#fff; }
#photo { position:absolute; inset:0; overflow:hidden; }
#photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.42) saturate(1.0); }
#photo-voile { position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.8) 100%); }
.tete { position:absolute; top:250px; left:110px; width:860px; text-align:center; }
.surtitre { font-size:30px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--violet-clair);
  text-shadow:0 2px 10px rgba(0,0,0,0.8); }
.titre { margin-top:14px; font-size:76px; font-weight:800; white-space:nowrap; text-shadow:0 4px 18px rgba(0,0,0,0.7); }
.filet { width:120px; height:8px; margin:22px auto 0; border-radius:4px; background:var(--violet-clair); }
.panneau { position:absolute; left:110px; top:430px; width:860px; height:640px; background:rgba(8,6,12,0.72);
  border:2px solid rgba(199,125,255,0.55); border-radius:34px; box-shadow:0 24px 60px rgba(0,0,0,0.55); overflow:hidden; }
.schema { position:absolute; left:110px; top:1086px; width:860px; text-align:right; font-size:20px; font-weight:600; color:rgba(214,208,224,0.8); font-style:italic; text-shadow:0 2px 6px #000; }
svg text { font-family:"Montserrat", sans-serif; }
.leg { font-size:26px; font-weight:600; fill:#e8e2f0; }
.leg-or { font-size:28px; font-weight:800; fill:#f2b544; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.00" data-width="1080" data-height="1920">
      <div id="photo" class="clip" data-start="0" data-duration="9.00" data-track-index="0" style="z-index:1"><img id="photo-img" src="assets/fond.jpg" alt="" /><div id="photo-voile"></div></div>
      <div id="scene" class="clip" data-start="0" data-duration="9.00" data-track-index="1" style="z-index:2">
        <div class="tete" id="tete"><div class="surtitre">Cristal de roche</div><div class="titre" style="font-size:76px">La transparence</div><div class="filet"></div></div>
        <div class="panneau" id="panneau"><svg width="860" height="640" viewBox="0 0 860 640"><polygon id="cri" points="250,560 250,200 430,70 610,200 610,560" fill="rgba(235,235,240,0.06)" stroke="#e8e2f0" stroke-width="4"/><path id="ray0" d="M 40 260 L 820 260" fill="none" stroke="#fff6c8" stroke-width="6" stroke-linecap="round"/><path id="ray1" d="M 40 340 L 820 340" fill="none" stroke="#fff6c8" stroke-width="6" stroke-linecap="round"/><path id="ray2" d="M 40 420 L 820 420" fill="none" stroke="#fff6c8" stroke-width="6" stroke-linecap="round"/><path id="ray3" d="M 40 500 L 820 500" fill="none" stroke="#fff6c8" stroke-width="6" stroke-linecap="round"/><g id="l"><text x="430" y="40" text-anchor="middle" class="leg">Peu d'impuretés, peu d'inclusions</text><text x="430" y="610" text-anchor="middle" class="leg-or">La lumière traverse presque sans être dispersée</text></g></svg></div>
        <div class="schema" id="schema">Illustration schématique</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#photo-img", { scale: 1.0 }, { scale: 1.07, duration: 9.00, ease: "none" }, 0);
      tl.fromTo("#tete", { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#panneau", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo("#schema", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
      tl.fromTo("#cri", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.50);
      tl.fromTo("#ray0", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 2.40);
      tl.fromTo("#ray1", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 2.75);
      tl.fromTo("#ray2", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 3.10);
      tl.fromTo("#ray3", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 3.45);
      tl.fromTo("#l", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.80);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
